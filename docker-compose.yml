services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # Endurecimento: sem escalada de privilégio e só as capacidades que o
    # entrypoint do Postgres precisa para trocar de root para "postgres".
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lcr-local-dev-pg-2026}
      POSTGRES_DB: acme
    volumes:
      # No Postgres 18 o volume é montado em /var/lib/postgresql (não mais em /data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d acme"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    # Endurecimento: o app roda sem root, sem nenhuma capacidade do kernel,
    # sem poder ganhar privilégios e com o sistema de arquivos somente
    # leitura (só /tmp, em memória, é gravável).
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://acme:${POSTGRES_PASSWORD:-lcr-local-dev-pg-2026}@db:5432/acme?sslmode=disable
      # Protege as chaves privadas da AC no banco (padrão = credencial local do .env.example).
      AC_SENHA: ${AC_SENHA:-lcr-local-dev-ac-2026}
      # URL que aparece no carimbo ("Verifique em ...") e nos certificados (LCR).
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ_ASSINATURA: America/Sao_Paulo
      # Proteção de memória sob carga: no máximo N cálculos Argon2id (64 MiB
      # cada) e N requisições com PDF ao mesmo tempo; o resto espera na fila.
      LIMITE_ARGON2: ${LIMITE_ARGON2:-4}
      LIMITE_PDF: ${LIMITE_PDF:-4}
      # Faz o coletor de lixo do Go trabalhar mais antes de passar deste valor.
      GOMEMLIMIT: ${GOMEMLIMIT:-768MiB}
      # Limites de tentativas (login, cadastro, senha). "off" só para teste
      # de carga; o servidor recusa "off" em produção.
      RATE_LIMIT: ${RATE_LIMIT:-on}
      # Cabeçalho do proxy confiável com o IP real do cliente (vazio = sem proxy).
      IP_HEADER: ${IP_HEADER:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
